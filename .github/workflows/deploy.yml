name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Clone butterfly theme
        run: git clone --depth 1 https://github.com/jerryc127/hexo-theme-butterfly.git themes/butterfly
      - name: Install hexo
        run: npm install hexo@5
      - name: Debug
        run: |
          echo "=== npm ls hexo ==="
          npm ls hexo 2>&1 || true
          echo "=== ls node_modules/hexo ==="
          ls -la node_modules/hexo/ 2>&1 || echo "NOT FOUND"
          echo "=== cat node_modules/hexo/package.json | grep -E version.name.bin ==="
          cat node_modules/hexo/package.json 2>&1 | grep -E '"version"|"name"|"bin"' || echo "NOT FOUND"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
