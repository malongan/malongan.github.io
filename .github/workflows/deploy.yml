name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: |
          npx hexo generate
          # Add .nojekyll to prevent Jekyll from ignoring asset directories
          touch public/.nojekyll
      - name: Verify build output
        run: |
          test -d public && test -n "$(ls -A public)" && echo "public OK: $(find public -type f | wc -l) files" || (echo "BUILD FAILED: public missing or empty" && exit 1)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          # Add .nojekyll to prevent Jekyll from ignoring asset directories
          exclude_files: ""
