name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy Hexo site
        uses: peaceiris/actions-hexo@v3
        with:
          deploy-git: true
          deploy-repo: ${{ github.repositoryUrl }}
          deploy-branch: gh-pages
          user-name: github-actions[bot]
          user-email: github-actions[bot]@users.noreply.github.com
